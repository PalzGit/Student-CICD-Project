
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      containers:
        - name: student-portal
          image: YOUR_DOCKERHUB_USERNAME/student-cicd:initial
          ports:
            - containerPort: 5000
